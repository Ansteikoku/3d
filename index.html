<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム作成プラットフォーム</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>ゲーム作成プラットフォーム</h1>
    </header>

    <div class="app">
        <!-- ゲーム一覧 -->
        <div class="game-list">
            <h2>作成したゲーム一覧</h2>
            <ul id="gamesList"></ul>
        </div>

        <!-- 新規ゲーム作成ボタン -->
        <button id="createNewGameBtn">新しいゲームを作成</button>
    </div>

    <script src="supabase.js"></script>
    <script>
        // Supabaseからゲーム一覧を取得する関数
        async function loadGames() {
            const { data, error } = await supabase
                .from('games')
                .select('*');

            if (error) {
                console.error('エラーが発生しました:', error);
                return;
            }

            // ゲーム一覧を表示
            const gamesList = document.getElementById('gamesList');
            gamesList.innerHTML = ''; // 既存のリストをクリア

            data.forEach(game => {
                const gameItem = document.createElement('li');
                gameItem.innerHTML = `${game.name} <button onclick="loadGameEditor(${game.id})">編集</button>`;
                gamesList.appendChild(gameItem);
            });
        }

        // ゲームエディタに遷移する関数
        function loadGameEditor(gameId) {
            window.location.href = `gameEditor.html?gameId=${gameId}`;
        }

        // 新規ゲーム作成ボタンのイベント
        document.getElementById('createNewGameBtn').addEventListener('click', function() {
            window.location.href = 'gameEditor.html';  // 新規ゲーム作成画面に遷移
        });

        // ページ読み込み時にゲーム一覧を取得
        loadGames();
    </script>
</body>
</html>

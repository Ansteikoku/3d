<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Babylon.js Keyboard Movement</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = function () {
      const scene = new BABYLON.Scene(engine);

      const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 3, 20, new BABYLON.Vector3(0, 1, 0), scene);
      camera.attachControl(canvas, true);

      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

      const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 20, height: 20}, scene);

      const player = BABYLON.MeshBuilder.CreateSphere("player", {diameter: 2}, scene);
      player.position.y = 1;

      // キーボード入力管理
      const inputMap = {};
      scene.actionManager = new BABYLON.ActionManager(scene);

      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(
        BABYLON.ActionManager.OnKeyDownTrigger, function (evt) {
          inputMap[evt.sourceEvent.key] = true;
        }
      ));

      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(
        BABYLON.ActionManager.OnKeyUpTrigger, function (evt) {
          inputMap[evt.sourceEvent.key] = false;
        }
      ));

      const speed = 0.1;

      scene.onBeforeRenderObservable.add(() => {
        if (inputMap["w"] || inputMap["ArrowUp"]) {
          player.position.z -= speed;
        }
        if (inputMap["s"] || inputMap["ArrowDown"]) {
          player.position.z += speed;
        }
        if (inputMap["a"] || inputMap["ArrowLeft"]) {
          player.position.x -= speed;
        }
        if (inputMap["d"] || inputMap["ArrowRight"]) {
          player.position.x += speed;
        }
      });

      return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>

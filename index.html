<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム作成プラットフォーム</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>ゲーム作成プラットフォーム</h1>
    </header>

    <div class="app">
        <!-- ゲームエディタ -->
        <div class="editor">
            <div class="game-editor">
                <h2>ゲームエディタ</h2>
                <button id="addObjectBtn">オブジェクトを追加</button>
                <ul id="gameObjectsList">
                    <!-- ゲームオブジェクトのリスト -->
                </ul>
            </div>

            <!-- スクリプトエディタ -->
            <div class="script-editor">
                <h2>スクリプトエディタ</h2>
                <textarea id="scriptInput" placeholder="スクリプトを記述"></textarea>
            </div>

            <!-- デバッグパネル -->
            <div class="debug-panel">
                <h2>デバッグパネル</h2>
                <pre id="debugOutput">デバッグ情報がここに表示されます...</pre>
            </div>
        </div>

        <!-- プレビューボタン -->
        <button id="previewBtn">プレビュー</button>

        <!-- プレビューパネル -->
        <div id="previewArea" class="preview-area">
            <h2>ゲームプレビュー</h2>
            <iframe id="gamePreview" src="" frameborder="0"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
